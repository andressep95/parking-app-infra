name: "Drift Detection & Auto-Remediation"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - dev
          - prod
      auto_remediate:
        description: 'Auto-remediate drift?'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AUTO_REMEDIATE: ${{ github.event.inputs.auto_remediate != 'false' && vars.AUTO_REMEDIATE != 'false' }}

jobs:
  detect-and-remediate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ github.event.inputs.environment && fromJSON(format('["{0}"]', github.event.inputs.environment)) || fromJSON('["dev"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.PROJECT_NAME }}/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: infrastructure/environments/${{ matrix.environment }}

      - name: Detect Drift
        id: plan
        run: |
          terraform plan -detailed-exitcode -no-color -out=tfplan > plan_output.txt 2>&1 || EXIT_CODE=$?
          echo "exitcode=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          cat plan_output.txt
        continue-on-error: true
        working-directory: infrastructure/environments/${{ matrix.environment }}

      - name: Generate Drift Report
        if: steps.plan.outputs.exitcode == '2'
        id: report
        run: |
          TIMESTAMP="${{ steps.plan.outputs.timestamp }}"
          ENV="${{ matrix.environment }}"
          DATE=$(echo "$TIMESTAMP" | cut -d'T' -f1)
          TIME=$(echo "$TIMESTAMP" | cut -d'T' -f2)

          REPORT_DIR="drift-reports/$DATE"
          mkdir -p "$REPORT_DIR"
          DRIFT_FILE="$REPORT_DIR/drift-${TIME}.json"

          cat > "$DRIFT_FILE" <<EOF
          {
            "drift_detected_at": "$TIMESTAMP",
            "environment": "$ENV",
            "github_run_id": "${{ github.run_id }}",
            "github_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "triggered_by": "${{ github.event_name }}",
            "commit_sha": "${{ github.sha }}",
            "plan_summary": $(terraform show -json tfplan | jq -c '.resource_changes // []'),
            "remediation": { "status": "pending" }
          }
          EOF

          echo "drift_file=$DRIFT_FILE" >> $GITHUB_OUTPUT
          echo "report_date=$DATE" >> $GITHUB_OUTPUT
          echo "report_time=$TIME" >> $GITHUB_OUTPUT

          echo "## 📊 Drift Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "**Detected at:** $TIMESTAMP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform show tfplan | grep -A 50 "Terraform will perform" >> $GITHUB_STEP_SUMMARY || true
        working-directory: infrastructure/environments/${{ matrix.environment }}

      - name: Upload Drift Report to S3
        if: steps.plan.outputs.exitcode == '2'
        run: |
          ENV="${{ matrix.environment }}"
          DATE="${{ steps.report.outputs.report_date }}"
          TIME="${{ steps.report.outputs.report_time }}"
          DRIFT_FILE="drift-reports/$DATE/drift-${TIME}.json"

          S3_PATH="s3://${{ env.TF_STATE_BUCKET }}/${{ env.PROJECT_NAME }}/$ENV/$DRIFT_FILE"
          aws s3 cp "infrastructure/environments/$ENV/$DRIFT_FILE" "$S3_PATH"
          echo "📤 Uploaded to: $S3_PATH"
        working-directory: .

      - name: Auto-Remediate Drift
        if: steps.plan.outputs.exitcode == '2' && env.AUTO_REMEDIATE == 'true'
        id: apply
        run: |
          echo "🔧 Applying remediation..."
          DATE="${{ steps.report.outputs.report_date }}"
          TIME="${{ steps.report.outputs.report_time }}"
          REPORT_DIR="drift-reports/$DATE"

          terraform apply -auto-approve tfplan > "$REPORT_DIR/apply-${TIME}.log" 2>&1 || EXIT_CODE=$?
          echo "apply_exitcode=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
          echo "remediation_timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          cat "$REPORT_DIR/apply-${TIME}.log"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Auto-Remediation Applied" >> $GITHUB_STEP_SUMMARY
          echo "**Remediated at:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
        working-directory: infrastructure/environments/${{ matrix.environment }}

      - name: Update Drift Report with Remediation
        if: steps.plan.outputs.exitcode == '2' && env.AUTO_REMEDIATE == 'true'
        run: |
          ENV="${{ matrix.environment }}"
          DATE="${{ steps.report.outputs.report_date }}"
          TIME="${{ steps.report.outputs.report_time }}"
          DRIFT_FILE="drift-reports/$DATE/drift-${TIME}.json"
          APPLY_LOG="drift-reports/$DATE/apply-${TIME}.log"

          jq --arg status "${{ steps.apply.outputs.apply_exitcode == '0' && 'success' || 'failed' }}" \
             --arg timestamp "${{ steps.apply.outputs.remediation_timestamp }}" \
             --arg exitcode "${{ steps.apply.outputs.apply_exitcode }}" \
             '.remediation = {
               "status": $status,
               "applied_at": $timestamp,
               "exit_code": $exitcode,
               "log_file": "apply-'${TIME}'.log"
             }' "$DRIFT_FILE" > "$DRIFT_FILE.tmp" && mv "$DRIFT_FILE.tmp" "$DRIFT_FILE"

          S3_BASE="s3://${{ env.TF_STATE_BUCKET }}/${{ env.PROJECT_NAME }}/$ENV/drift-reports/$DATE"
          aws s3 cp "$DRIFT_FILE" "$S3_BASE/drift-${TIME}.json"
          aws s3 cp "$APPLY_LOG" "$S3_BASE/apply-${TIME}.log"
          echo "📤 Updated reports in S3: $S3_BASE/"
        working-directory: infrastructure/environments/${{ matrix.environment }}

      - name: Create GitHub Issue for Drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ matrix.environment }}';
            const driftTime = '${{ steps.plan.outputs.timestamp }}';
            const remediationTime = '${{ steps.apply.outputs.remediation_timestamp }}';
            const applySuccess = '${{ steps.apply.outputs.apply_exitcode }}' === '0';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const date = '${{ steps.report.outputs.report_date }}';
            const time = '${{ steps.report.outputs.report_time }}';

            const body = `## 🚨 Drift Detected and ${applySuccess ? '✅ Remediated' : '❌ Remediation Failed'}

            **Environment:** \`${env}\`
            **Drift Detected:** ${driftTime}
            **Remediation Applied:** ${remediationTime}
            **Status:** ${applySuccess ? '✅ Success' : '❌ Failed'}

            ### 📊 Reports
            - **Drift Report:** \`s3://${{ env.TF_STATE_BUCKET }}/${{ env.PROJECT_NAME }}/${env}/drift-reports/${date}/drift-${time}.json\`
            - **Apply Log:** \`s3://${{ env.TF_STATE_BUCKET }}/${{ env.PROJECT_NAME }}/${env}/drift-reports/${date}/apply-${time}.log\`
            - **Workflow Run:** [View Details](${runUrl})

            ### 🔍 Investigation Required
            ${applySuccess ?
              'Drift was automatically remediated. Please investigate why manual changes were made outside of GitOps workflow.' :
              '⚠️ Auto-remediation failed. Manual intervention required.'}

            ---
            *This issue was automatically created by the Drift Detection workflow.*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${env.toUpperCase()}] Drift Detected - ${driftTime}`,
              body: body,
              labels: ['drift-detection', `env:${env}`, applySuccess ? 'auto-remediated' : 'remediation-failed']
            });

      - name: Send Slack Notification
        if: steps.plan.outputs.exitcode == '2' && vars.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ steps.apply.outputs.apply_exitcode == '0' && '✅' || '❌' }} Drift Detection Alert - ${{ matrix.environment }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.apply.outputs.apply_exitcode == '0' && '✅ Drift Auto-Remediated' || '❌ Drift Remediation Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Environment:*\n${{ matrix.environment }}" },
                    { "type": "mrkdwn", "text": "*Detected:*\n${{ steps.plan.outputs.timestamp }}" },
                    { "type": "mrkdwn", "text": "*Status:*\n${{ steps.apply.outputs.apply_exitcode == '0' && 'Success ✅' || 'Failed ❌' }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: No Drift Detected
        if: steps.plan.outputs.exitcode == '0'
        run: echo "✅ No drift detected - infrastructure is in sync with Git" >> $GITHUB_STEP_SUMMARY
